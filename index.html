<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101c3a">
  <meta name="description" content="A little digital letter made with love.">
  <title>A Little Place for You</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="assets/js/main.js" defer></script>
</head>
<body class="page-cover">
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <header class="site-header">
    <a class="wordmark" href="index.html" aria-label="Home"><span class="wordmark-heart">♥</span> a little place for you</a>
    <span class="header-note">made just for you</span>
  </header>

  <main class="cover-layout">
    <section class="cover-copy">
      <p class="eyebrow"><span class="eyebrow-line"></span> A LETTER, FROM ME TO YOU</p>
      <h1>Different places.<br><em>Still close at heart.</em></h1>
      <p class="cover-intro">To Athena </p>
      <div class="cover-actions">
        <a class="button button-primary" href="pages/letter.html">Open your letter <span aria-hidden="true">↗</span></a>
        <a class="text-link" href="pages/memories.html">A few little memories <span aria-hidden="true">→</span></a>
      </div>
      <p class="tiny-note"><span aria-hidden="true">♡</span> Open whenever you need a little reminder.</p>
    </section>

    <section class="cover-art" aria-label="A photo from your memories">
      <div class="orbit orbit-one"></div><div class="orbit orbit-two"></div>
      <figure class="polaroid polaroid-main">
        <img src="assets/images/photos/photo-01.svg" alt="Replace with a favourite photo">
        <figcaption>you are perfect the way you look </figcaption>
      </figure>
      <figure class="polaroid polaroid-small">
        <img src="assets/images/photos/photo-02.svg" alt="Replace with another favourite photo">
        <figcaption>Dont worry about me stop caring about you that is never going to happen</figcaption>
      </figure>
      <span class="floating-heart heart-one" aria-hidden="true">♡</span>
      <span class="floating-heart heart-two" aria-hidden="true">♥</span>
      <span class="art-note">our little<br>corner of the world</span>
    </section>
  </main>

  <footer class="site-footer">
    <span>For the days that feel a little far away.</span>
    <span class="footer-star" aria-hidden="true">✳</span>
  </footer>
</body>
</html>
